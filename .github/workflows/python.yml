name: Django CI

on:
  push:
    branches: [ "main" ]
  pull_request:
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
    - name: Install the latest version of uv
      uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
      with:
        version: "latest"
    - name: Lint
      run: |
        uv run ruff check
        uv run ruff format --check
    - name: Run the pre-commit hooks
      run: uvx pre-commit run --all-files --show-diff-on-failure
  test:
    runs-on: ubuntu-latest
    steps:
    # Start Postgres in the background (pull included) so it boots while dependencies install.
    - name: Start Postgres
      run: |
        nohup docker run -d --name postgres -p 5432:5432 \
          -e POSTGRES_USER=postgres -e POSTGRES_PASSWORD=postgres_password \
          postgres:18-alpine > "$RUNNER_TEMP/postgres.log" 2>&1 &
    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
    - name: Install the latest version of uv
      uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
      with:
        enable-cache: true
        cache-python: true
        version: "latest"
    - name: Install dependencies
      run: uv sync --locked
    - name: Collect static files
      run: uv run python manage.py collectstatic
    #- name: Compile translations
    #  run: uv run python manage.py compilemessages
    # - name: Check migrations
    #   run: uv run python manage.py makemigrations --check
    - name: Wait for Postgres
      run: |
        for _ in $(seq 60); do
          docker exec postgres pg_isready -U postgres -h 127.0.0.1 >/dev/null 2>&1 && exit 0
          sleep 1
        done
        cat "$RUNNER_TEMP/postgres.log"
        docker logs postgres || true
        exit 1
    - name: Run Tests
      env:
        FLAKYTEST_SECRET_TOKEN: ${{ secrets.FLAKYTEST_SECRET_TOKEN }}
        FLAKYTEST_PROFILE: '1'
        DJANGO_DATABASE_USER: postgres
        DATABASE_URL: 'postgresql://postgres:postgres_password@127.0.0.1:5432/fedidevs'
      run: uv run pytest -n auto
  deploy:
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'
    steps:
    - name: Deploy
      uses: appleboy/ssh-action@068c0c7a4e59a5ae12fb7cb454b05735d830c82b # master
      with:
        host: ${{ secrets.SSH_HOST }}
        username: ${{ secrets.SSH_USERNAME }}
        key: ${{ secrets.SSH_KEY }}
        port: ${{ secrets.SSH_PORT }}
        script: |
          bash projects/fedidevs/.deploy/update.sh
